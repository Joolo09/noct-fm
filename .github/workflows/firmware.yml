name: Build NOCT firmware
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firmware/**', 'integrations/**', 'site/**', 'emulator/**', 'tests/**', 'tools/emulator.py', 'upstream/base/**', 'tools/prepare-site.py', 'build.sh', '.github/workflows/firmware.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      X0X_FONTSET: terminus
      JIELI_DOCKER: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Test DAW integrations and C application
        run: |
          python tests/test_integrations.py
          python tests/test_prepare_site.py
          sh build.sh --host --no-ble
          mkdir -p test-output
          firmware/app/build/host/noct-usb_host tests/noct.ctl test-output
          python tests/test_midi_engine.py
          python tests/test_ui_workflows.py
          python tests/test_review_regressions.py
          python tests/test_chords_lights.py
          python tests/test_usb_chords.py
          python tests/test_v08_features.py
          python tests/test_v081_generator.py
          python tests/test_v09_output.py
          python tests/test_fuzz.py
          python tests/test_v093_link.py
      - name: Repeat the C application tests on the Bluetooth build
        run: |
          sh build.sh --host
          export NOCT_HOST="$PWD/firmware/app/build/host/noct_host"
          "$NOCT_HOST" tests/noct.ctl test-output
          for t in tests/test_midi_engine.py tests/test_ui_workflows.py tests/test_review_regressions.py \
                   tests/test_chords_lights.py tests/test_usb_chords.py tests/test_v08_features.py \
                   tests/test_v081_generator.py tests/test_v09_output.py tests/test_fuzz.py tests/test_v093_link.py; do
            python "$t"
          done
      - uses: actions/cache@v4
        id: toolchain
        with:
          path: ~/.jieli
          key: jieli-pi32v2-linux-v1
      - name: Download official JieLi toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: sh upstream/base/tools/get_toolchain.sh
      - name: Download official AC79 SDK
        run: |
          if git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"; then
            echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"
          else
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://github.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79-mirror"
            echo "AC79_SDK=$HOME/fw-AC79-mirror" >> "$GITHUB_ENV"
          fi
      - name: Build the USB-only firmware and run image checks
        run: |
          sh build.sh --no-ble --release 0.9.4
          mkdir -p usb-only && cp firmware/app/build/noct-usb-0.9.4.fwsc usb-only/
      - name: Build the USB + Bluetooth firmware and run image checks
        run: sh build.sh --release 0.9.4
      - uses: actions/upload-artifact@v4
        with:
          name: noct-firmware
          path: |
            firmware/app/build/noct-0.9.4.fwsc
            firmware/app/build/noct.bin
            firmware/app/build/loader/ota.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: noct-usb-only
          path: usb-only/noct-usb-0.9.4.fwsc
          if-no-files-found: error
      - name: Prepare installer bundle
        run: python tools/prepare-site.py --firmware firmware/app/build/noct-0.9.4.fwsc --output web-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: noct-installer-site
          path: web-bundle
