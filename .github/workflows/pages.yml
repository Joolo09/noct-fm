name: Deploy NOCT installer
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build NOCT firmware]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Test installer and prepare static files
        run: |
          node tests/installer.test.mjs
          python tools/prepare-site.py --output _site
      - name: Include the verified firmware from this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          run="$BUILD_RUN_ID"
          if [ -z "$run" ]; then
            run=$(gh run list --workflow firmware.yml --branch main --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId // empty')
          fi
          test -n "$run" || { echo "Build firmware successfully for this commit before deploying." >&2; exit 1; }
          gh run download "$run" --name noct-usb-alpha --dir downloaded
          file=$(find downloaded -name '*.fwsc' -print -quit)
          test -n "$file"
          python tools/prepare-site.py --firmware "$file" --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
